<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Imagem 01</title>
    <style>

        body {
            background-image: url(imagens/imagens-cap19/wallpaper001.jpg);
            background-position: center;
        }

        div.quadrado {
            display: inline-block;
            width: 300px;
            height: 300px;
            border: 2px solid #000;
            margin: 30px;
            border-radius: 10px;
            background-color: lightgray;
            text-align: center;
        }

        div#q1 {
            background-color: lightblue;
        }

        div#q2 {
            background-image: linear-gradient(to bottom right, lightyellow, lightblue);
        }

        div#q3 {
            background-image: url(imagens/imagens-cap19/wallpaper002.jpg);
            background-size: cover;
            background-position: center;    
        }

        div#q4 {
            background-image: url(imagens/imagens-cap19/pattern002.png);
            background-size: cover;
            background-position: bottom right;    
        }
    </style>
</head>
<body>
    <div class="quadrado" id="q1">
        
    </div>

    <div class="quadrado" id="q2">

    </div>

    <div class="quadrado" id="q3">

    </div>

    <div class="quadrado" id="q4">

    </div>
</body>
</html>
